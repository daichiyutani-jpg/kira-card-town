<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<!-- デスサイズゴースト（闇・亡霊・SR）：見上げの構図で大鎌を振りかぶる瞬間。裂けたフードと布、骨の仮面に細く光る目、胸の鎖と錠前、足のない下半身は黒い霧に溶ける。 -->
<defs>
  <radialGradient id="bg" cx="50%" cy="80%" r="90%"><stop offset="0" stop-color="#2a3a2a"/><stop offset=".5" stop-color="#16101e"/><stop offset="1" stop-color="#05030a"/></radialGradient>
  <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2a4a"/><stop offset=".6" stop-color="#1a1222"/><stop offset="1" stop-color="#0a060e" stop-opacity="0"/></linearGradient>
  <linearGradient id="bone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4eedc"/><stop offset="1" stop-color="#9a9078"/></linearGradient>
  <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8f0f0"/><stop offset=".4" stop-color="#7a8a90"/><stop offset="1" stop-color="#1a2226"/></linearGradient>
  <linearGradient id="haft" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a1a12"/><stop offset=".5" stop-color="#5a3a26"/><stop offset="1" stop-color="#1a0e08"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="fog" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="3" seed="11"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .9  0 0 0 0 .55  0 0 0 -1.6 1"/><feGaussianBlur stdDeviation="1"/></filter>
  <filter id="tatter"><feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="9"/></filter>
</defs>
<rect width="400" height="300" fill="url(#bg)"/>
<!-- 墓標と枯れ木 -->
<g fill="#0a0810"><path d="M20 300 L24 230 L40 226 L44 300Z M330 300 L334 240 L360 236 L362 300Z M370 300 C368 220 380 180 400 160 L400 300Z M300 120 C330 110 360 90 380 60 M360 100 l14 -20 M330 110 l6 -20" stroke="#0a0810" stroke-width="4"/></g>
<!-- 月（細い） -->
<path d="M70 50 C56 50 46 40 46 28 C52 38 62 42 72 40 C68 44 70 48 70 50Z" fill="#c8f0d0" opacity=".7"/>
<!-- 毒の霧 -->
<rect y="150" width="400" height="150" filter="url(#fog)" opacity=".7"/>
<!-- 大鎌の柄（斜めに振りかぶる） -->
<path d="M84 286 L304 22 L314 30 L94 294Z" fill="url(#haft)" stroke="#000" stroke-width="1.5"/>
<g stroke="#8a7a5a" stroke-width="2"><path d="M150 210 l10 8 M200 150 l10 8"/></g>
<!-- 鎌の刃（大きく弧を描く） -->
<path d="M300 26 C250 4 180 8 120 40 C170 34 220 40 262 60 C276 48 290 36 300 26Z" fill="url(#blade)" stroke="#05080a" stroke-width="2"/>
<path d="M126 40 C176 32 226 40 262 58" stroke="#ffffff" stroke-width="1.5" fill="none" opacity=".8"/>
<path d="M140 30 C190 18 240 20 280 30" stroke="#9af0b0" stroke-width="1" fill="none" opacity=".6" filter="url(#glow)"/>
<!-- 斬撃の軌跡 -->
<path d="M120 40 C60 80 40 150 60 210" stroke="#9af0b0" stroke-width="3" fill="none" opacity=".45" filter="url(#glow)"/>
<!-- 外套（裂けた布・下は霧に溶ける） -->
<g filter="url(#tatter)">
  <path d="M200 70 C240 76 268 104 280 150 C290 196 300 240 330 280 C296 272 280 286 258 266 C246 286 228 280 214 296 C206 276 186 284 172 268 C156 286 136 276 120 284 C140 240 150 196 160 150 C170 104 176 76 200 70Z" fill="url(#cloth)"/>
  <!-- 腕の袖（振りかぶる） -->
  <path d="M244 104 C268 98 288 82 300 58 L312 70 C300 100 276 120 252 128Z" fill="#2a1e36"/>
  <path d="M164 116 C146 126 130 150 124 178 L140 182 C146 160 158 142 174 132Z" fill="#2a1e36"/>
</g>
<!-- 骨の手 -->
<path d="M298 56 l8 -8 l6 4 l-2 8 l8 2 l-4 8 l-10 -2Z" fill="url(#bone)" stroke="#3a3428" stroke-width="1"/>
<path d="M124 178 l-6 8 l6 4 l4 -6 l6 6 l4 -6 l-4 -6Z" fill="url(#bone)" stroke="#3a3428" stroke-width="1"/>
<!-- 胸の鎖と錠前 -->
<g fill="none" stroke="#8a8a90" stroke-width="2.5">
  <path d="M168 150 C190 162 218 162 252 140"/>
  <ellipse cx="180" cy="156" rx="5" ry="3"/><ellipse cx="196" cy="160" rx="5" ry="3"/><ellipse cx="212" cy="160" rx="5" ry="3"/><ellipse cx="228" cy="154" rx="5" ry="3"/><ellipse cx="242" cy="146" rx="5" ry="3"/>
</g>
<path d="M200 164 h16 v14 h-16Z" fill="#5a5a60" stroke="#1a1a1e" stroke-width="1.5"/>
<path d="M204 164 v-5 a4 4 0 0 1 8 0 v5" fill="none" stroke="#5a5a60" stroke-width="2"/>
<circle cx="208" cy="171" r="2" fill="#9af0b0" filter="url(#glow)"/>
<!-- フード -->
<path d="M200 46 C228 48 248 70 252 100 C240 116 222 124 202 124 C182 124 164 114 156 100 C160 70 176 48 200 46Z" fill="#2a1e36" stroke="#05030a" stroke-width="2"/>
<path d="M200 46 C214 40 224 30 228 18 C222 36 220 46 226 56Z" fill="#2a1e36"/>
<!-- 骨の仮面（フードの奥） -->
<path d="M178 86 C178 70 190 62 204 62 C218 62 230 72 228 88 C226 102 216 112 204 112 C190 112 180 100 178 86Z" fill="#0a060e"/>
<path d="M184 84 C186 72 196 68 204 68 C214 68 222 74 222 86 C220 98 212 104 204 104 C194 104 186 96 184 84Z" fill="url(#bone)"/>
<path d="M188 84 L200 80 L198 88Z M220 84 L208 80 L210 88Z" fill="#05030a"/>
<!-- 光る細い目 -->
<path d="M190 84 L199 82 M218 84 L209 82" stroke="#b8ff9a" stroke-width="2.4" stroke-linecap="round" filter="url(#glow)"/>
<path d="M200 92 l4 4 l4 -4" stroke="#3a3428" stroke-width="1.5" fill="none"/>
<path d="M194 100 h20 M198 100 v4 M204 100 v4 M210 100 v4" stroke="#3a3428" stroke-width="1.2"/>
<!-- 縁の光（下からの毒の光） -->
<path d="M252 104 C266 140 278 190 300 240" stroke="#9af0b0" stroke-width="1.5" fill="none" opacity=".5"/>
<path d="M156 104 C150 140 142 190 132 240" stroke="#9af0b0" stroke-width="1.5" fill="none" opacity=".5"/>
<!-- 漂う魂の火 -->
<g fill="#9af0b0" filter="url(#glow)" opacity=".9"><circle cx="90" cy="120" r="3"/><circle cx="340" cy="170" r="3.5"/><circle cx="310" cy="210" r="2"/><circle cx="60" cy="180" r="2"/></g>
</svg>
